# 工控 / 信创：自动查找官方下载页（浏览器抓取 + OpenRouter）
# 密钥：仅使用仓库 Secrets 中的 OPENROUTER_API_KEY。
# 切勿把 API key 粘贴进 workflow inputs、日志或提交到仓库。

name: Find Downloads (ICS / 信创)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "数据源：ics / xinchuang / both"
        required: false
        type: choice
        options:
          - both
          - ics
          - xinchuang
        default: both
      dedupe_keys:
        description: "去重键（逗号分隔；空=自动挑待核/空下载页）。勿粘贴 API key。"
        required: false
        type: string
        default: ""
      limit:
        description: "每源最多处理条数（免费额度安全上限 8）"
        required: false
        type: number
        default: 3
      force:
        description: "已可下也强制重核"
        required: false
        type: boolean
        default: false
      max_steps:
        description: "单条最多浏览步数"
        required: false
        type: number
        default: 6
  schedule:
    # 每天 15:00 UTC ≈ 23:00 Asia/Shanghai — 扫待核/空下载页
    - cron: "0 15 * * *"

concurrency:
  group: asset-monitor-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  find-downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mask OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set. Add it in repo Settings → Secrets."
            exit 1
          fi
          echo "::add-mask::$OPENROUTER_API_KEY"

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Find downloads
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          SOURCE="${{ github.event.inputs.source }}"
          if [ -z "$SOURCE" ]; then SOURCE=both; fi
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT=3; fi
          if [ "$LIMIT" -gt 8 ]; then LIMIT=8; fi
          if [ "$LIMIT" -lt 1 ]; then LIMIT=1; fi
          MAX_STEPS="${{ github.event.inputs.max_steps }}"
          if [ -z "$MAX_STEPS" ]; then MAX_STEPS=6; fi
          KEYS="${{ github.event.inputs.dedupe_keys }}"
          FORCE="${{ github.event.inputs.force }}"
          ARGS=(--source "$SOURCE" --limit "$LIMIT" --max-steps "$MAX_STEPS")
          if [ -n "$KEYS" ]; then
            ARGS+=(--keys "$KEYS")
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          python3 scripts/find_downloads.py "${ARGS[@]}"

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ics.json data/xinchuang.json config.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(downloads): update ICS / 信创 download pages"
          attempt_push() {
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main
              return 0
            fi
            echo "::warning::rebase conflict; resolving"
            # During rebase: --ours = upstream main, --theirs = our commit
            while git diff --name-only --diff-filter=U | grep -q .; do
              for f in $(git diff --name-only --diff-filter=U); do
                if [ "$f" = "config.json" ]; then
                  # keep higher updatedAt
                  python3 -c "
import json,re,pathlib
p=pathlib.Path('config.json')
t=p.read_text()
# extract both sides if conflicted
m=re.search(r'<<<<<<<[^\n]*\n(.*?)\n=======\n(.*?)\n>>>>>>>[^\n]*', t, re.S)
if m:
    import json as J
    def parse(s):
        try: return J.loads(s)
        except: return None
    a,b=parse(m.group(1)),parse(m.group(2))
    if a and b:
        cfg=b if str(b.get('updatedAt',''))>=str(a.get('updatedAt','')) else a
        # preserve sources from whichever has them
        if not cfg.get('sources'): cfg['sources']=(a.get('sources') or b.get('sources'))
        p.write_text(J.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
    else:
        p.write_text(m.group(2))
else:
    pass
"
                else
                  git checkout --theirs -- "$f"
                fi
                git add -- "$f"
              done
              if ! GIT_EDITOR=true git rebase --continue; then
                if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                  continue
                fi
                break
              fi
            done
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo "::error::unresolved rebase"
              git rebase --abort || true
              return 1
            fi
            git push origin HEAD:main
          }
          attempt_push
