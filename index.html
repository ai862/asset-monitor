<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>资产监控中心</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-main">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="12" rx="2"/>
              <path d="M8 20h8M12 16v4"/>
              <path d="M7 8h2M11 8h2M15 8h2"/>
            </svg>
          </span>
          <div>
            <h1 id="page-title">资产监控中心</h1>
            <p class="subtitle">Notion 镜像 · 本地静态加速</p>
          </div>
        </div>
        <div class="header-meta">
          <div class="sync-pill" title="数据同步时间">
            <svg class="sync-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7v5l3 2"/>
            </svg>
            <span>同步 <time id="updated-at">—</time></span>
          </div>
          <a id="notion-edit" class="btn ghost" href="#" target="_blank" rel="noopener">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 4h6v6"/><path d="M10 14L20 4"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
            </svg>
            在 Notion 编辑
          </a>
        </div>
      </div>

      <nav class="tabs" id="tabs" role="tablist" aria-label="监控分类"></nav>

      <div class="toolbar">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
          </svg>
          <input id="search" type="search" placeholder="搜索产品 / 厂商 / 去重键…" autocomplete="off" />
          <kbd class="hint">/</kbd>
        </div>
        <div class="view-toggle" role="group" aria-label="视图">
          <button type="button" class="view-btn active" data-view="table" title="表格" aria-label="表格视图">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M3 9h18M3 15h18M9 3v18"/>
            </svg>
          </button>
          <button type="button" class="view-btn" data-view="cards" title="卡片" aria-label="卡片视图">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="8" height="8" rx="1.5"/>
              <rect x="13" y="3" width="8" height="8" rx="1.5"/>
              <rect x="3" y="13" width="8" height="8" rx="1.5"/>
              <rect x="13" y="13" width="8" height="8" rx="1.5"/>
            </svg>
          </button>
        </div>
        <div class="result-count"><span id="visible-count">0</span> / <span id="total-count">0</span></div>
      </div>

      <div class="filters">
        <div class="filter-group" id="status-filters">
          <span class="filter-label">状态</span>
          <div class="chips" id="status-chips"></div>
        </div>
        <div class="filter-group hidden" id="extra-filters">
          <span class="filter-label" id="extra-label">类型</span>
          <div class="chips" id="extra-chips"></div>
        </div>
      </div>
    </header>

    <main class="main">
      <div id="loading" class="state">
        <svg class="state-icon spin" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" opacity=".25"/>
          <path d="M21 12a9 9 0 0 0-9-9"/>
        </svg>
        <span>加载中…</span>
      </div>
      <div id="empty" class="state hidden">
        <svg class="state-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/><path d="M8 11h6"/>
        </svg>
        <span>没有匹配的资产</span>
      </div>
      <div id="error" class="state error hidden"></div>
      <div id="table-view" class="table-wrap hidden"></div>
      <div id="cards-view" class="cards-grid hidden"></div>
    </main>

    <footer class="footer">
      <p>数据从 Notion 三张资产表镜像；编辑请回 Notion。本页可托管到 GitHub Pages。</p>
      <p class="footer-links" id="footer-links"></p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
